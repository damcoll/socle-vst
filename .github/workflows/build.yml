name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: cmake -B build -A x64
          - name: macOS
            os: macos-latest
            configure: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target Socle_VST3 $([ "$RUNNER_OS" = macOS ] && echo "Socle_AU")

      # macOS refuses unsigned code on Apple Silicon: an ad-hoc signature is enough to load it
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - build/Socle_artefacts/Release/VST3/SOCLE.vst3 build/Socle_artefacts/Release/AU/SOCLE.component

      # pluginval (Tracktion) loads the plugin like a host would; on macOS it also runs auval on the AU
      - name: Validate
        shell: bash
        run: |
          VST3=build/Socle_artefacts/Release/VST3/SOCLE.vst3
          if [ "$RUNNER_OS" = macOS ]; then
            curl -sfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
            unzip -q pluginval.zip
            PLUGINVAL=pluginval.app/Contents/MacOS/pluginval
          else
            curl -sfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
            unzip -q pluginval.zip
            PLUGINVAL=./pluginval.exe
          fi
          $PLUGINVAL --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$VST3"

          if [ "$RUNNER_OS" = macOS ]; then
            # install the AU and make macOS register it before testing
            mkdir -p ~/Library/Audio/Plug-Ins/Components
            cp -R build/Socle_artefacts/Release/AU/SOCLE.component ~/Library/Audio/Plug-Ins/Components/
            killall -9 AudioComponentRegistrar || true
            auval -a > /dev/null
            auval -v aumu Scl1 Mnlt
            $PLUGINVAL --strictness-level 5 --skip-gui-tests --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/SOCLE.component
          fi

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cd build/Socle_artefacts/Release
          ditto -c -k --keepParent VST3/SOCLE.vst3 ../../../dist/SOCLE-macOS-VST3.zip
          ditto -c -k --keepParent AU/SOCLE.component ../../../dist/SOCLE-macOS-AU.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/Socle_artefacts/Release/VST3/SOCLE.vst3 -DestinationPath dist/SOCLE-Windows-VST3.zip

      - uses: actions/upload-artifact@v5
        with:
          name: SOCLE-${{ matrix.name }}
          path: dist/*.zip

  # a tag like v0.1.0 publishes the Windows and macOS zips on a GitHub Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the release text lives in the repo (NOTES.md)
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "SOCLE $GITHUB_REF_NAME" \
            --notes-file NOTES.md
